name: Keep Streamlit App Awake

# Streamlit Community Cloud sleeps apps that get no visitors, which shows
# visitors a "get this app back up" screen instead of the app.
# scripts/keep_awake.py visits the app in a real headless browser (a plain
# curl does not count as a visit) and presses the wake button if needed.
on:
  schedule:
    # Every 6 hours, half of Cloud's 12-hour inactivity window
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python scripts/keep_awake.py
